[project]
name = "pacificeo-monitor"
version = "0.1.0"
description = "Hardened service shell for multi-tenant Earth Observation monitoring"
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.10.4,<4",
  "fastapi>=0.115,<1",
  "geoalchemy2>=0.15,<1",
  "httpx>=0.27,<1",
  "pyjwt>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "pyyaml>=6.0,<7",
  "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pacificeo"]

[tool.vercel]
entrypoint = "src.pacificeo.main:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "BLE001"]
